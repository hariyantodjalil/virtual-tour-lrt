name: ${VIRTUALTOUR_STACK_NAME:-lrt-dev-virtualtour}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtual_tour_lrt}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Asia/Jakarta
    volumes:
      - virtualtour-db-data:/var/lib/postgresql/data
    ports:
      - "6010:5432"
    networks:
      - virtualtour
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  virtualtour:
    image: ${LRT_VIRTUALTOUR_IMAGE:-lrt-virtualtour:dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${VIRTUALTOUR_HTTP_BIND:-0.0.0.0}:${VIRTUALTOUR_HTTP_PORT:-5011}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/virtual_tour_lrt?schema=public}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-dev}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-virtual-tour-lrt}
      TZ: Asia/Jakarta
    networks:
      - virtualtour
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  virtualtour:
    name: ${VIRTUALTOUR_NETWORK_NAME:-lrt-dev-virtualtour-network}
    driver: overlay
    attachable: true

volumes:
  virtualtour-db-data:
    name: ${VIRTUALTOUR_DB_VOLUME_NAME:-lrt-dev-virtualtour-postgres-data}
