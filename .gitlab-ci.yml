workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - validate
  - test
  - prepare
  - publish
  - deploy
  - verify
  - release

default:
  interruptible: true

variables:
  REGISTRY_HOST: $CI_REGISTRY
  REGISTRY_USERNAME: $CI_REGISTRY_USER
  REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
  REGISTRY_IMAGE_ROOT: $CI_REGISTRY_IMAGE

include:
  - project: "divisi-lrt/lrt-cicd"
    ref: "v0.1.7"
    file: "/templates/reporting.yml"
  - project: "divisi-lrt/lrt-cicd"
    ref: "v0.1.7"
    file: "/templates/release-metadata.yml"
  - project: "divisi-lrt/lrt-cicd"
    ref: "v0.1.7"
    file: "/templates/publish-image.yml"
  - project: "divisi-lrt/lrt-cicd"
    ref: "v0.1.7"
    file: "/templates/deploy.yml"

.skip-release-tag-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: never
    - when: on_success

.dev-release-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $REGISTRY_IMAGE_ROOT && $REGISTRY_HOST && $REGISTRY_USERNAME && $REGISTRY_PASSWORD'
    - when: never

.dev-deploy-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $REGISTRY_IMAGE_ROOT && $REGISTRY_HOST && $REGISTRY_USERNAME && $REGISTRY_PASSWORD && $DEV_DEPLOY_HOST && $DEV_DEPLOY_USER && $DEV_DEPLOY_ENV_FILE && $DEV_DEPLOY_RELEASE_ROOT && $DEV_SSH_PRIVATE_KEY && $DEV_SSH_KNOWN_HOSTS'
    - when: never

.prod-release-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $REGISTRY_IMAGE_ROOT && $REGISTRY_HOST && $REGISTRY_USERNAME && $REGISTRY_PASSWORD'
    - when: never

.prod-deploy-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $REGISTRY_IMAGE_ROOT && $REGISTRY_HOST && $REGISTRY_USERNAME && $REGISTRY_PASSWORD && $PROD_DEPLOY_HOST && $PROD_DEPLOY_USER && $PROD_DEPLOY_ENV_FILE && $PROD_DEPLOY_RELEASE_ROOT && $PROD_SSH_PRIVATE_KEY && $PROD_SSH_KNOWN_HOSTS'
      when: manual
      allow_failure: false
    - when: never

.prod-verify-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $REGISTRY_IMAGE_ROOT && $REGISTRY_HOST && $REGISTRY_USERNAME && $REGISTRY_PASSWORD && $PROD_DEPLOY_HOST && $PROD_DEPLOY_USER && $PROD_DEPLOY_ENV_FILE && $PROD_DEPLOY_RELEASE_ROOT && $PROD_SSH_PRIVATE_KEY && $PROD_SSH_KNOWN_HOSTS'
    - when: never

release:tag-policy:
  stage: validate
  image: alpine:3.20
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  before_script:
    - apk add --no-cache git
  script:
    - test "v$(cat VERSION)" = "$CI_COMMIT_TAG"
    - git fetch origin main --no-tags
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main

.node-runtime-env:
  variables:
    DATABASE_URL: postgresql://virtualtour:virtualtour-ci@127.0.0.1:5432/virtual_tour_lrt?schema=public
    NEXTAUTH_SECRET: ci-secret
    S3_ENDPOINT: http://127.0.0.1:9000
    S3_ACCESS_KEY_ID: ci
    S3_SECRET_ACCESS_KEY: ci
    S3_REGION: us-east-1
    S3_BUCKET: virtual-tour-lrt
    NEXT_TELEMETRY_DISABLED: "1"

validate:metadata:
  stage: validate
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:22-alpine
  rules:
    - !reference [.skip-release-tag-rules, rules]
  script:
    - >
      node -e 'const fs=require("fs"); const pkg=JSON.parse(fs.readFileSync("package.json","utf8")); const version=fs.readFileSync("VERSION","utf8").trim(); const changelog=fs.readFileSync("CHANGELOG.md","utf8"); if(pkg.version!==version) throw new Error("package.json version mismatch: "+pkg.version+" != "+version); if(!changelog.includes("## v"+version+" - ")) throw new Error("missing changelog section for v"+version);'

validate:env-templates:
  stage: validate
  image: alpine:3.20
  rules:
    - !reference [.skip-release-tag-rules, rules]
  script:
    - |
      set -eu
      for env_file in .env.dev.example .env.prod.example; do
        for name in LRT_VIRTUALTOUR_IMAGE VIRTUALTOUR_CONTAINER_NAME VIRTUALTOUR_DB_CONTAINER_NAME VIRTUALTOUR_HTTP_BIND VIRTUALTOUR_HTTP_PORT POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD DATABASE_URL S3_ENDPOINT S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET NEXTAUTH_SECRET; do
          grep -q "^${name}=" "$env_file"
        done
      done
      grep -q '^VIRTUALTOUR_HTTP_PORT=80$' .env.prod.example

validate:compose:
  stage: validate
  image: docker:27.5.1-cli
  rules:
    - !reference [.skip-release-tag-rules, rules]
  script:
    - docker compose --env-file .env.dev.example -f docker-compose.dev.yml config >/dev/null
    - docker compose --env-file .env.prod.example -f docker-compose.prod.yml config >/dev/null

app-checks:
  extends: .node-runtime-env
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:22-alpine
  rules:
    - !reference [.skip-release-tag-rules, rules]
  script:
    - npm ci
    - npm run db:generate
    - npm run lint
    - npm run build

release:dev:
  extends: .release-metadata-template
  stage: prepare
  rules:
    - !reference [.dev-release-rules, rules]
  script:
    - |
      version="$(cat VERSION)"
      image_repo="${REGISTRY_IMAGE_ROOT%/}"
      image_tag="lrt-virtualtour-dev-${CI_COMMIT_SHORT_SHA}"
      {
        printf 'RELEASE_METADATA_READY=1\n'
        printf 'LRT_VIRTUALTOUR_VERSION=%s\n' "$version"
        printf 'LRT_VIRTUALTOUR_IMAGE_REPO=%s\n' "$image_repo"
        printf 'LRT_VIRTUALTOUR_IMAGE_TAGS=%s\n' "${image_tag},lrt-virtualtour-dev-dev,lrt-virtualtour-dev-latest"
        printf 'LRT_VIRTUALTOUR_IMAGE_CACHE=%s\n' "${image_repo}:lrt-virtualtour-buildcache"
        printf 'LRT_VIRTUALTOUR_IMAGE=%s:%s\n' "$image_repo" "$image_tag"
      } > ci-release/release.env

release:prod:
  extends: .release-metadata-template
  stage: prepare
  rules:
    - !reference [.prod-release-rules, rules]
  script:
    - |
      version="$(cat VERSION)"
      image_repo="${REGISTRY_IMAGE_ROOT%/}"
      image_tag="lrt-virtualtour-prod-${CI_COMMIT_SHORT_SHA}"
      {
        printf 'RELEASE_METADATA_READY=1\n'
        printf 'LRT_VIRTUALTOUR_VERSION=%s\n' "$version"
        printf 'LRT_VIRTUALTOUR_IMAGE_REPO=%s\n' "$image_repo"
        printf 'LRT_VIRTUALTOUR_IMAGE_TAGS=%s\n' "${image_tag},lrt-virtualtour-prod-latest"
        printf 'LRT_VIRTUALTOUR_IMAGE_CACHE=%s\n' "${image_repo}:lrt-virtualtour-buildcache"
        printf 'LRT_VIRTUALTOUR_IMAGE=%s:%s\n' "$image_repo" "$image_tag"
      } > ci-release/release.env

publish:dev:web:
  extends: .publish-image-template
  rules:
    - !reference [.dev-release-rules, rules]
  needs:
    - job: release:dev
      artifacts: true
  variables:
    IMAGE_REPO_VAR: LRT_VIRTUALTOUR_IMAGE_REPO
    IMAGE_TAGS_VAR: LRT_VIRTUALTOUR_IMAGE_TAGS
    CACHE_IMAGE_VAR: LRT_VIRTUALTOUR_IMAGE_CACHE
    IMAGE_JOB_NAME: lrt-virtualtour
    DOCKERFILE_PATH: Dockerfile
    DOCKER_CONTEXT: .

publish:prod:web:
  extends: .publish-image-template
  rules:
    - !reference [.prod-release-rules, rules]
  needs:
    - job: release:prod
      artifacts: true
  variables:
    IMAGE_REPO_VAR: LRT_VIRTUALTOUR_IMAGE_REPO
    IMAGE_TAGS_VAR: LRT_VIRTUALTOUR_IMAGE_TAGS
    CACHE_IMAGE_VAR: LRT_VIRTUALTOUR_IMAGE_CACHE
    IMAGE_JOB_NAME: lrt-virtualtour
    DOCKERFILE_PATH: Dockerfile
    DOCKER_CONTEXT: .

deploy:dev:
  extends: .deploy-template
  rules:
    - !reference [.dev-deploy-rules, rules]
  needs:
    - job: release:dev
      artifacts: true
    - publish:dev:web
  variables:
    DEPLOY_ENVIRONMENT: dev
    DEPLOY_SSH_HOST: $DEV_DEPLOY_HOST
    DEPLOY_SSH_USER: $DEV_DEPLOY_USER
    DEPLOY_SSH_PORT: $DEV_DEPLOY_PORT
    DEPLOY_REMOTE_RELEASE_ROOT: $DEV_DEPLOY_RELEASE_ROOT
    DEPLOY_REMOTE_ENV_FILE: $DEV_DEPLOY_ENV_FILE
    SSH_PRIVATE_KEY: $DEV_SSH_PRIVATE_KEY
    SSH_PASSWORD: $DEV_SSH_PASSWORD
    SSH_KNOWN_HOSTS: $DEV_SSH_KNOWN_HOSTS
    DEPLOY_COMMAND: sh scripts/deploy_remote_release.sh

deploy:prod:
  extends: .deploy-template
  rules:
    - !reference [.prod-deploy-rules, rules]
  needs:
    - job: release:prod
      artifacts: true
    - publish:prod:web
  variables:
    DEPLOY_ENVIRONMENT: prod
    DEPLOY_SSH_HOST: $PROD_DEPLOY_HOST
    DEPLOY_SSH_USER: $PROD_DEPLOY_USER
    DEPLOY_SSH_PORT: $PROD_DEPLOY_PORT
    DEPLOY_REMOTE_RELEASE_ROOT: $PROD_DEPLOY_RELEASE_ROOT
    DEPLOY_REMOTE_ENV_FILE: $PROD_DEPLOY_ENV_FILE
    SSH_PRIVATE_KEY: $PROD_SSH_PRIVATE_KEY
    SSH_PASSWORD: $PROD_SSH_PASSWORD
    SSH_KNOWN_HOSTS: $PROD_SSH_KNOWN_HOSTS
    DEPLOY_COMMAND: sh scripts/deploy_remote_release.sh

verify:dev:
  extends: .verify-template
  before_script:
    - apk add --no-cache bash curl openssh-client
    - |
      if [ -n "${SSH_PASSWORD:-}" ]; then
        apk add --no-cache sshpass
      fi
    - |
      if [ -f ci-release/release.env ]; then
        set -a
        . ci-release/release.env
        set +a
      fi
    - mkdir -p "$HOME/.ssh"
    - chmod 700 "$HOME/.ssh"
    - |
      if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
        if [ -f "$SSH_PRIVATE_KEY" ]; then
          cp "$SSH_PRIVATE_KEY" "$HOME/.ssh/id_ed25519"
        else
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
        fi
        chmod 600 "$HOME/.ssh/id_ed25519"
      fi
    - |
      if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
        printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
        chmod 644 "$HOME/.ssh/known_hosts"
      else
        touch "$HOME/.ssh/known_hosts"
      fi
  rules:
    - !reference [.dev-deploy-rules, rules]
  needs:
    - deploy:dev
    - job: release:dev
      artifacts: true
  variables:
    DEPLOY_ENVIRONMENT: dev
    DEPLOY_SSH_HOST: $DEV_DEPLOY_HOST
    DEPLOY_SSH_USER: $DEV_DEPLOY_USER
    DEPLOY_SSH_PORT: $DEV_DEPLOY_PORT
    DEPLOY_REMOTE_RELEASE_ROOT: $DEV_DEPLOY_RELEASE_ROOT
    SSH_PRIVATE_KEY: $DEV_SSH_PRIVATE_KEY
    SSH_PASSWORD: $DEV_SSH_PASSWORD
    SSH_KNOWN_HOSTS: $DEV_SSH_KNOWN_HOSTS
    VERIFY_COMMAND: sh scripts/verify_remote_release.sh

verify:prod:
  extends: .verify-template
  before_script:
    - apk add --no-cache bash curl openssh-client
    - |
      if [ -n "${SSH_PASSWORD:-}" ]; then
        apk add --no-cache sshpass
      fi
    - |
      if [ -f ci-release/release.env ]; then
        set -a
        . ci-release/release.env
        set +a
      fi
    - mkdir -p "$HOME/.ssh"
    - chmod 700 "$HOME/.ssh"
    - |
      if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
        if [ -f "$SSH_PRIVATE_KEY" ]; then
          cp "$SSH_PRIVATE_KEY" "$HOME/.ssh/id_ed25519"
        else
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
        fi
        chmod 600 "$HOME/.ssh/id_ed25519"
      fi
    - |
      if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
        printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
        chmod 644 "$HOME/.ssh/known_hosts"
      else
        touch "$HOME/.ssh/known_hosts"
      fi
  rules:
    - !reference [.prod-verify-rules, rules]
  needs:
    - deploy:prod
    - job: release:prod
      artifacts: true
  variables:
    DEPLOY_ENVIRONMENT: prod
    DEPLOY_SSH_HOST: $PROD_DEPLOY_HOST
    DEPLOY_SSH_USER: $PROD_DEPLOY_USER
    DEPLOY_SSH_PORT: $PROD_DEPLOY_PORT
    DEPLOY_REMOTE_RELEASE_ROOT: $PROD_DEPLOY_RELEASE_ROOT
    SSH_PRIVATE_KEY: $PROD_SSH_PRIVATE_KEY
    SSH_PASSWORD: $PROD_SSH_PASSWORD
    SSH_KNOWN_HOSTS: $PROD_SSH_KNOWN_HOSTS
    VERIFY_COMMAND: sh scripts/verify_remote_release.sh

release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - !reference [.prod-verify-rules, rules]
  needs:
    - job: verify:prod
  script:
    - test "v$(cat VERSION)" = "$CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: lrt-virtualtour $CI_COMMIT_TAG
    description: ./CHANGELOG.md
