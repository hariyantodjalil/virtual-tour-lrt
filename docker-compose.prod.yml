name: ${VIRTUALTOUR_STACK_NAME:-lrt-prod-virtualtour}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-virtual_tour_lrt}
      POSTGRES_USER: ${POSTGRES_USER:-virtualtour}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - virtualtour-db-data:/var/lib/postgresql/data
    networks:
      - virtualtour
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  virtualtour:
    image: ${LRT_VIRTUALTOUR_IMAGE:?LRT_VIRTUALTOUR_IMAGE is required}
    ports:
      - "${VIRTUALTOUR_HTTP_BIND:-0.0.0.0}:${VIRTUALTOUR_HTTP_PORT:-80}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:-1}
      TZ: ${TZ:-Asia/Jakarta}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-virtual-tour-lrt}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    networks:
      - virtualtour
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        order: start-first

networks:
  virtualtour:
    name: ${VIRTUALTOUR_NETWORK_NAME:-lrt-prod-virtualtour-network}
    driver: overlay
    attachable: true

volumes:
  virtualtour-db-data:
    name: ${VIRTUALTOUR_DB_VOLUME_NAME:-lrt-prod-virtualtour-postgres-data}
